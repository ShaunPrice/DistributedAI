name: distributedai

x-app: &app
  image: distributedai:0.1.0
  build:
    context: .
    target: runtime
  environment: &environment
    SUPPORT_DEFAULTS_FILE: /run/secrets/support_defaults
    DB_HOST: db
    DB_PASSWORD_FILE: /run/secrets/db_password
    PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8090/mcp}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1:*,localhost:*}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    OIDC_ISSUER: ${OIDC_ISSUER:-}
    OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
    OIDC_SUBJECTS_FILE: /run/secrets/oidc_subjects
    BILLING_ENABLED: ${BILLING_ENABLED:-false}
    BILLING_PLAN_LIMITS_FILE: /run/secrets/billing_plan_limits
    BILLING_PRICES_FILE: /run/secrets/billing_prices
    PAYMENT_PROVIDERS_FILE: /run/secrets/payment_providers
    OIDC_CONNECTIONS_FILE: /run/secrets/oidc_connections
    CONTENT_MASTER_KEY_FILE: /run/secrets/content_master_key
    KEY_PROVIDERS_FILE: /run/secrets/key_providers
    TENANT_KEY_PROVIDERS_FILE: /run/secrets/tenant_key_providers
    PLATFORM_SUBJECTS_FILE: /run/secrets/platform_subjects
    PLATFORM_ADMIN_TOKEN_FILE: /run/secrets/platform_admin_token
    LOGIN_MODE: ${LOGIN_MODE:-token}
    LOGIN_PROVIDER: ${LOGIN_PROVIDER:-Organisation}
    LOGIN_ISSUER: ${LOGIN_ISSUER:-}
    LOGIN_CLIENT_ID: ${LOGIN_CLIENT_ID:-}
    LOGIN_CLIENT_SECRET_FILE: /run/secrets/login_client_secret
    LOGIN_SUBJECTS_FILE: /run/secrets/login_subjects
    MANAGEMENT_KEY_FILE: /run/secrets/management_key
  secrets: [support_defaults, db_password, oidc_subjects, management_key, login_client_secret, login_subjects, content_master_key, key_providers, tenant_key_providers, platform_admin_token, platform_subjects, billing_plan_limits, billing_prices, payment_providers, oidc_connections]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: distributedai
      POSTGRES_USER: distributedai
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U distributedai -d distributedai]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    <<: *app
    command: [distributedai, init]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:${PORT:-8090}:8090"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  bootstrap:
    <<: *app
    profiles: [setup]
    environment:
      <<: *environment
      BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    secrets: [support_defaults, db_password, oidc_subjects, bootstrap_token, management_key, login_client_secret, login_subjects, content_master_key, key_providers, tenant_key_providers, platform_admin_token, platform_subjects, billing_plan_limits, billing_prices, payment_providers, oidc_connections]
    command: [distributedai, bootstrap]
    depends_on:
      init: {condition: service_completed_successfully}

secrets:
  support_defaults: {file: ./.secrets/support_defaults.json}
  db_password: {file: ./.secrets/db_password}
  bootstrap_token: {file: ./.secrets/bootstrap_token}
  oidc_subjects: {file: ./.secrets/oidc_subjects.json}
  billing_plan_limits: {file: ./.secrets/billing_plan_limits.json}
  billing_prices: {file: ./.secrets/billing_prices.json}
  payment_providers: {file: ./.secrets/payment_providers.json}
  oidc_connections: {file: ./.secrets/oidc_connections.json}
  content_master_key: {file: ./.secrets/content_master_key}
  key_providers: {file: ./.secrets/key_providers.json}
  tenant_key_providers: {file: ./.secrets/tenant_key_providers.json}
  platform_subjects: {file: ./.secrets/platform_subjects.json}
  platform_admin_token: {file: ./.secrets/platform_admin_token}
  login_client_secret: {file: ./.secrets/login_client_secret}
  login_subjects: {file: ./.secrets/login_subjects.json}
  management_key: {file: ./.secrets/management_key}
volumes:
  pgdata:
