# SPDX-License-Identifier: Apache-2.0
name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check distributedai tests scripts
      - run: uv run python scripts/audit_licenses.py --check-lock
      - run: uv run pytest -q
      - run: uv run python -m unittest discover -s deploy -p 'test_*.py'
      - run: python3 scripts/setup.py --generate-only
      - run: docker compose -f compose.yaml -f compose.test.yaml build test
      - run: docker compose -f compose.yaml -f compose.test.yaml run --rm test
      - if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down --volumes
  terraform:
    strategy:
      matrix:
        module: [infra/aws, infra/serverless/aws, infra/serverless/azure, infra/serverless/gcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=${{ matrix.module }} init -backend=false
      - run: terraform -chdir=${{ matrix.module }} validate
