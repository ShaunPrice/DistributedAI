# SPDX-License-Identifier: Apache-2.0
name: Security checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.10'
      - run: uv sync --locked
      - name: Scan Python source with Bandit
        run: |
          uvx --from bandit==1.9.4 bandit -r distributedai -ll -f json -o /tmp/distributedai-bandit.json
          uv run --no-sync python -c 'import json, pathlib, sys; report = json.loads(pathlib.Path("/tmp/distributedai-bandit.json").read_text()); sys.exit(f"Bandit scan incomplete: {report["errors"]}" if report["errors"] or not report["metrics"]["_totals"]["loc"] else 0)'
      - run: uv export --frozen --all-extras --no-emit-project --format requirements-txt -o /tmp/distributedai-requirements.txt
      - run: uvx --from pip-audit==2.9.0 pip-audit -r /tmp/distributedai-requirements.txt --no-deps --disable-pip
  codeql:
    # Public repositories can use CodeQL free. Do not enable paid private scanning implicitly.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v3
