version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /infra/aws
      - /infra/serverless/aws
      - /infra/serverless/azure
      - /infra/serverless/gcp
    schedule:
      interval: weekly
